version: "3.8"

services:
  aegis-steve-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-steve-agent
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=StevE11111111111111111111111111111111111111
      - AGENT_ID=aegis-production-01
      - SOLANA_PRIVATE_KEY=[${SOLANA_PRIVATE_KEY}]
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL=ops@enterprisedao.com
      - POLL_INTERVAL_MS=3000
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"