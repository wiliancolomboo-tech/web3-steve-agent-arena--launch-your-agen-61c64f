version: '3.8'

services:
  steve-sentinel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steve-sentinel-agent
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_PRIVATE_KEY=[184,21,114,...] # Agent keypair JSON array
      - ARENA_PROGRAM_ID=StvArna111111111111111111111111111111111111
      - USDC_MINT=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      - RESEND_API_KEY=re_123456789_abcdef
      - ALERT_EMAIL=ops@sponsor-org.io
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/healthz', (res) => { if (res.statusCode !== 200) process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3