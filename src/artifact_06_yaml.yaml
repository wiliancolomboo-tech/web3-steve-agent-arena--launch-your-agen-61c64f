version: "3.8"

services:
  steve-agent-arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steve-agent-arena
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - STEVE_ARENA_PROGRAM_ID=StvArenA11111111111111111111111111111111111
      - AGENT_PRIVATE_KEY_HEX=${AGENT_PRIVATE_KEY_HEX}
      - AGENT_NAME=Aegis-Steve-V1
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"