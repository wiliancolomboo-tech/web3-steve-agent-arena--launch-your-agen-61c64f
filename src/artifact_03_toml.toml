[package]
name = "steve-arena-agent"
version = "0.1.0"
description = "Steve Agent Arena Autonomous Controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "steve_arena_agent"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }