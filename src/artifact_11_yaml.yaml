version: "3.8"

services:
  vanguard-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanguard-steve-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Vangd87wM2UvKzF5V64sXN9FpA3gJ7V1qWbL8aC9zXm
      - AGENT_PRIVATE_KEY=[14,242,12,...] # Put byte array or mount via secret
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - ALERT_EMAIL=admin@vanguard-arena.com
      - MAX_STAKE_AMOUNT=10000000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"