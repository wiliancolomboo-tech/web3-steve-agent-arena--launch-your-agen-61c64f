version: "3.8"

services:
  apex-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_steve_agent
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - AGENT_PRIVATE_KEY=[1,2,3...your_keypair_json_bytes...]
      - USDC_MINT_ADDRESS=4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - RESEND_API_KEY=re_test_000000000000000000000000
      - TREASURY_EMAIL=ops@sponsor-steve-arena.com
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PORT=9090
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s