[package]
name = "steve-agent-arena"
version = "0.1.0"
description = "Deterministic Autonomous Agent Battle and Settlement Arena on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "steve_agent_arena"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"